name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libdbus-1-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Installer script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/rhythia-is-trash -Force | Out-Null
          Copy-Item README.md, LICENSE dist/rhythia-is-trash/
          Copy-Item assets/fonts/NOTICE.txt dist/rhythia-is-trash/FONTS-NOTICE.txt
          New-Item -ItemType File dist/rhythia-is-trash/rhythm.exe | Out-Null
          iscc /Q "/DSource=$env:GITHUB_WORKSPACE\dist\rhythia-is-trash" packaging\windows\rhythia-is-trash.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
